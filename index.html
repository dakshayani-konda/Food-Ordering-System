<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiffin Table: Food Ordering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Tiffin Table</h1>
    <nav>
      <button class="tab active" data-view="menu">Menu</button>
      <button class="tab" data-view="orders">My orders</button>
      <button class="tab" data-view="admin">Kitchen</button>
    </nav>
    <button id="cartToggle" class="cart-pill">Cart <span id="cartCount">0</span></button>
  </header>

  <main>
    <section id="view-menu" class="view">
      <div class="filters">
        <input id="search" type="search" placeholder="Search dishes" aria-label="Search dishes">
        <div id="chips" class="chips"></div>
        <label class="veg"><input id="vegOnly" type="checkbox"> Veg only</label>
      </div>
      <div id="menuList"></div>
    </section>

    <section id="view-orders" class="view" hidden>
      <h2>My orders</h2>
      <div id="orderList"></div>
    </section>

    <section id="view-admin" class="view" hidden>
      <h2>Kitchen board</h2>
      <p class="note">Update an order's status. This mirrors <code>UPDATE orders SET status = ...</code> in <code>03_queries.sql</code>.</p>
      <div id="adminList"></div>
      <h3>Menu availability</h3>
      <div id="availList" class="avail"></div>
    </section>
  </main>

  <aside id="cart" class="cart" aria-label="Cart">
    <div class="cart-head"><h2>Your cart</h2><button id="cartClose" aria-label="Close cart">Close</button></div>
    <div id="cartItems"></div>
    <div class="cart-foot">
      <div class="total"><span>Total</span><strong id="cartTotal">₹0</strong></div>
      <input id="custName" placeholder="Name" autocomplete="name">
      <input id="custPhone" placeholder="Phone" autocomplete="tel" inputmode="tel">
      <input id="custAddr" placeholder="Delivery address" autocomplete="street-address">
      <p id="formMsg" class="msg" role="alert"></p>
      <button id="placeOrder" class="primary">Place order</button>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>
  <script src="app.js"></script>
</body>
</html>
